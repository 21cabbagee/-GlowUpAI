services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skinproof
      POSTGRES_USER: skinproof
      POSTGRES_PASSWORD: skinproof
    ports:
      - "5432:5432"
    volumes:
      - skinproof-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skinproof -d skinproof"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://skinproof:skinproof@postgres:5432/skinproof
      SKINPROOF_ENV: production
      SKINPROOF_GEMINI_ENABLED: "0"
    ports:
      - "8000:8000"

volumes:
  skinproof-postgres:
